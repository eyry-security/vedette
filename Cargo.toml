[package]
name = "vedette"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast, multi-threaded HTTP prober. The forward scout of the Eyry recon suite."
repository = "https://github.com/eyry-security/vedette"
readme = "README.md"
keywords = ["recon", "http", "prober", "security", "bugbounty"]
categories = ["command-line-utilities"]

[[bin]]
name = "vedette"
path = "src/main.rs"

[lib]
name = "vedette"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
